<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>

  <!-- ===== 字体渲染全局设置 ===== -->

  <!-- 开启抗锯齿 -->
  <match target="font">
    <edit name="antialias" mode="assign">
      <bool>true</bool>
    </edit>

    <!-- 开启微调 (hinting) -->
    <edit name="hinting" mode="assign">
      <bool>true</bool>
    </edit>

    <!-- 微调级别: hintslight(轻微) / hintmedium / hintfull -->
    <edit name="hintstyle" mode="assign">
      <const>hintslight</const>
    </edit>

    <!-- 开启子像素(LCD)渲染, rgba 取值: rgb / bgr / vrgb / vbgr / none -->
    <edit name="rgba" mode="assign">
      <const>none</const>
    </edit>

    <!-- LCD 滤波器, 配合子像素渲染减少彩色 fringe, 取值: lcdnone / lcddefault / lcdlight / lcdlegacy -->
    <edit name="lcdfilter" mode="assign">
      <const>lcddefault</const>
    </edit>

    <!-- 自动 hinter (一般保持默认) -->
    <edit name="autohint" mode="assign">
      <bool>false</bool>
    </edit>

    <!-- 可选: 渲染顺序, 默认即可 -->
    <edit name="embeddedbitmap" mode="assign">
      <bool>false</bool>
    </edit>
  </match>

</fontconfig>

