<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>

  <!-- ===== 字体渲染全局设置 ===== -->

  <match target="font">
    <!-- 开启抗锯齿 -->
    <edit name="antialias" mode="assign">
      <bool>true</bool>
    </edit>

    <!-- 开启微调 (hinting) -->
    <edit name="hinting" mode="assign">
      <bool>true</bool>
    </edit>

    <!-- 拉丁文默认使用 hintfull (清晰锐利) -->
    <edit name="hintstyle" mode="assign">
      <const>hintfull</const>
    </edit>

    <!-- 子像素(LCD)渲染 -->
    <edit name="rgba" mode="assign">
      <const>none</const>
    </edit>

    <!-- LCD 滤波器 -->
    <edit name="lcdfilter" mode="assign">
      <const>lcddefault</const>
    </edit>

    <!-- 自动 hinter (拉丁文开启) -->
    <edit name="autohint" mode="assign">
      <bool>true</bool>
    </edit>

    <!-- 禁用内嵌点阵 -->
    <edit name="embeddedbitmap" mode="assign">
      <bool>false</bool>
    </edit>
  </match>

  <!-- ===== 中文(CJK)字体使用 hintslight 策略 ===== -->
  <!-- 中文字形复杂，hintfull 会破坏笔画结构，hintslight 保持字形准确 -->

  <match target="font">
    <test name="lang" compare="contains">
      <string>zh</string>
    </test>
    <edit name="hintstyle" mode="assign">
      <const>hintslight</const>
    </edit>
    <edit name="autohint" mode="assign">
      <bool>false</bool>
    </edit>
  </match>

  <match target="font">
    <test name="lang" compare="contains">
      <string>ja</string>
    </test>
    <edit name="hintstyle" mode="assign">
      <const>hintslight</const>
    </edit>
    <edit name="autohint" mode="assign">
      <bool>false</bool>
    </edit>
  </match>

  <match target="font">
    <test name="lang" compare="contains">
      <string>ko</string>
    </test>
    <edit name="hintstyle" mode="assign">
      <const>hintslight</const>
    </edit>
    <edit name="autohint" mode="assign">
      <bool>false</bool>
    </edit>
  </match>

</fontconfig>
